<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local AI 小幫手</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --text: #1d1d1f; --dim: #6e6e73; --line: #e3e1dc;
    --accent: #c96442; --accent-text: #ffffff; --ok: #2f9e5b; --warn: #b7791f; --danger: #c0392b;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Cascadia Mono", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141414; --card: #1f1f1f; --text: #f2f2f2; --dim: #9a9a9f; --line: #2e2e2e; --accent: #e0896b; --accent-text: #1a1a1a; --ok: #4cc27a; --warn: #e0a84b; --danger: #ff6b5b; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 system-ui, -apple-system, "Segoe UI", "Microsoft JhengHei", "Noto Sans TC", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { font: 700 22px/1.3 var(--mono); margin: 0 0 4px; }
  h1 .mark { color: var(--accent); }
  .sub { color: var(--dim); margin: 0 0 24px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 14px; }
  h2 { font-size: 13px; font-weight: 600; color: var(--dim); margin: 0 0 10px; letter-spacing: .02em; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .grow { flex: 1; min-width: 0; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ok); flex: none; }
  .dot.off { background: var(--warn); }
  .name { font-weight: 600; font-size: 17px; }
  .mono { font-family: var(--mono); }
  .addr { font: 14px/1.8 var(--mono); }
  .tag { font-size: 12px; color: var(--dim); border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; margin-left: 6px; }
  .hint { color: var(--dim); font-size: 13px; margin: 8px 0 0; }
  .ok { color: var(--ok); }
  .warn { color: var(--warn); }
  .error { color: var(--danger); }
  button { font: inherit; border-radius: 10px; padding: 8px 14px; cursor: pointer; border: 1px solid var(--line); background: transparent; color: var(--text); }
  button:hover { border-color: var(--dim); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 700; padding: 12px 18px; width: 100%; }
  button.primary:hover { filter: brightness(1.05); }
  button.link { border: none; padding: 0; color: var(--accent); font-weight: 600; }
  button.danger { color: var(--danger); }
  input { font: inherit; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); min-width: 0; flex: 1; }
  .devices { list-style: none; margin: 0 0 12px; padding: 0; }
  .devices li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .devices li:last-child { border-bottom: none; }
  .devices .when { color: var(--dim); font-size: 13px; }
  .pairing { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; }
  .pairing img { width: 220px; height: 220px; border-radius: 10px; background: #fff; padding: 6px; image-rendering: pixelated; }
  .code { font: 700 34px/1.2 var(--mono); letter-spacing: .08em; margin: 4px 0; }
  .steps { margin: 0; padding-left: 20px; }
  @media (max-width: 560px) { .pairing { grid-template-columns: 1fr; justify-items: center; text-align: center; } .steps { text-align: left; } }
  footer { margin-top: 24px; display: flex; justify-content: space-between; align-items: center; color: var(--dim); font-size: 13px; }
  a { color: var(--accent); }
  .install { margin-top: 12px; padding: 14px; border-radius: 10px; background: var(--bg); }
  .install p { margin: 0 0 10px; }
  .track { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin: 8px 0 4px; }
  .fill { height: 100%; background: var(--accent); width: 0; transition: width .3s; }
  .cmd { display: flex; gap: 8px; align-items: center; margin: 8px 0; }
  .cmd code { flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap; font: 14px/1.6 var(--mono); padding: 8px 10px; border-radius: 8px; background: var(--card); border: 1px solid var(--line); }
  label.check { display: flex; gap: 8px; align-items: center; margin-top: 12px; cursor: pointer; }
  label.check input { flex: none; width: 18px; height: 18px; accent-color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1><span class="mark">◆</span> <span data-t="title"></span></h1>
  <p class="sub" data-t="subtitle"></p>

  <p id="apiError" class="error" hidden></p>

  <section>
    <h2 data-t="phones"></h2>
    <div id="pairingView" hidden>
      <div class="pairing">
        <img id="qr" alt="">
        <div>
          <ol class="steps">
            <li data-t="step1"></li>
            <li data-t="step2"></li>
          </ol>
          <p class="hint" data-t="orCode"></p>
          <div class="code" id="code"></div>
          <p class="hint" id="countdown"></p>
          <button id="stopPairing" data-t="cancel"></button>
        </div>
      </div>
    </div>
    <div id="phonesView">
      <p id="paired" class="ok" hidden></p>
      <ul class="devices" id="devices"></ul>
      <p id="noDevices" class="hint" data-t="noDevices" hidden></p>
      <button class="primary" id="startPairing" data-t="pair"></button>
      <p id="awake" class="hint" hidden></p>
    </div>
  </section>

  <section>
    <h2 data-t="engines"></h2>
    <div id="engines">…</div>
    <div id="ollamaBox" class="install" hidden></div>
    <p class="hint" data-t="enginesHint"></p>
    <div class="row" id="engineActions">
      <button class="link" id="addServerBtn" data-t="addServer"></button>
      <button class="link" id="redetectBtn" data-t="redetect"></button>
    </div>
    <form id="serverForm" hidden>
      <div class="row"><input id="serverUrl" placeholder="http://127.0.0.1:8080" required></div>
      <div class="row" style="margin-top:8px"><input id="serverName" maxlength="40"><input id="serverKey" type="password" autocomplete="off"></div>
      <div class="row" style="margin-top:8px">
        <button type="submit" data-t="add"></button>
        <button type="button" id="cancelServer" data-t="cancel"></button>
        <span id="serverError" class="error"></span>
      </div>
    </form>
  </section>

  <section>
    <h2 data-t="computer"></h2>
    <div class="row" id="nameView">
      <span class="name" id="name">…</span>
      <button class="link" id="renameBtn" data-t="rename"></button>
    </div>
    <form class="row" id="nameEdit" hidden>
      <input id="nameInput" maxlength="40" required>
      <button type="submit" data-t="save"></button>
      <button type="button" id="cancelRename" data-t="cancel"></button>
    </form>
    <p class="hint" data-t="nameHint"></p>
    <label class="check" id="autostartRow" hidden><input type="checkbox" id="autostart"><span data-t="autostart"></span></label>
  </section>

  <section>
    <h2 data-t="addresses"></h2>
    <div id="firewallBox" class="install" hidden style="margin: 0 0 12px"></div>
    <div id="addrs" class="addr">…</div>
    <p class="hint" data-t="addrHint"></p>
  </section>

  <p id="offline" class="error" hidden data-t="offline"></p>

  <footer>
    <span id="version"></span>
    <button class="danger" id="quitBtn" data-t="quit"></button>
  </footer>
</main>
<script>
const zh = (navigator.language || '').toLowerCase().startsWith('zh');
const isWin = /Windows/i.test(navigator.userAgent);
const T = zh ? {
  title: 'Local AI 小幫手',
  subtitle: '讓家裡的手機用這台電腦上的 AI 模型。這個頁面只有這台電腦看得到。',
  phones: '手機',
  pair: '配對新手機',
  noDevices: '還沒有配對的手機。按下面的按鈕，用手機掃 QR code 就能連上。',
  step1: '在手機打開 Local AI，按「連接你的電腦」。',
  step2: '選「掃描 QR code」，對準左邊的圖。',
  orCode: '不能掃描的話，在手機輸入配對碼：',
  countdown: (m, s) => `還有 ${m}:${s} 可以配對`,

  remove: '移除',
  removeConfirm: (n) => `移除「${n}」？移除後這支手機就連不到這台電腦，要用的話得重新配對。`,

  never: '還沒用過',

  engines: 'AI 引擎',
  ollamaOk: (v) => `Ollama ${v}・運作中`,
  ollamaMissing: 'Ollama：還沒有裝',
  ollamaNotRunning: 'Ollama：裝了但沒有開著',
  ollamaOff: 'Ollama：沒有開（目前用其他引擎）',
  managed: '（小幫手幫你開著）',
  noEngine: '這台電腦還沒有 AI 引擎。按一下就幫你裝好 Ollama：免費、不用管理員權限，大約要下載 1.6 GB。',
  alsoOllama: '也可以裝 Ollama，手機就能直接下載更多模型（大約 1.6 GB）。',
  install: '安裝 Ollama',
  installing: { downloading: '正在下載 Ollama…', verifying: '正在檢查檔案是不是官方的…', extracting: '正在解開檔案…', starting: '正在打開 Ollama…' },

    disk_full: '磁碟空間不夠，請清出空間再試一次。',
    checksum: '下載的檔案跟官方的不一樣，已經刪掉了。請再試一次。',
    network: '下載失敗，請確認網路再試一次。',

  },
  retry: '再試一次',
  notRunningHint: 'Ollama 裝了但沒有開著，手機用不到它的模型。',
  startOllama: '打開 Ollama',
  starting: '正在打開…',
  startFailed: '打不開 Ollama',
  lastExit: (e) => `上次結束的原因：${e}`,
  running: (n) => `運作中・${n} 個模型`,
  unreachable: '連不到',
  openaiCompat: 'OpenAI 相容伺服器',
  enginesHint: '會自動找 LM Studio，以及 llama.cpp、vLLM、Jan、GPT4All 的常見連接埠。手機上會看到所有引擎的模型。',
  addServer: '新增其他伺服器',
  redetect: '重新尋找',
  add: '新增',
  serverNamePh: '名稱（可以不填）',
  serverKeyPh: 'API 金鑰（需要時才填）',
  badUrl: '網址格式不對，例如 http://127.0.0.1:8080',
  removeServer: (n) => `移除「${n}」？`,
  computer: '這台電腦',
  rename: '改名',
  save: '儲存',
  cancel: '取消',
  nameHint: '手機上會用這個名字顯示這台電腦。',
  autostart: '開機時自動打開小幫手',
  awakeOn: '手機正在使用，這段時間電腦不會睡著（螢幕照常會關）。',
  awakeError: (e) => `系統不讓小幫手在手機使用中擋住睡眠，電腦可能會睡著。${/denied/i.test(e) ? '從桌面登入後打開小幫手（或開機自動打開）就可以。' : ''}（${e}）`,
  fwLinux: (k) => `這台電腦開著防火牆（${k}），手機可能連不進來。請在終端機執行下面這一行（要輸入電腦的密碼）：`,
  fwLinuxBlocked: (k) => `這台電腦的防火牆（${k}）擋著手機。請在終端機執行下面這一行（要輸入電腦的密碼）：`,
  fwSeenHint: '手機連進來過之後，這個提示就會消失。',
  copy: '複製',
  copied: '已複製',
  fwWindows: 'Windows 防火牆可能會擋住手機。',
  fwAllow: '允許手機連進來',
  fwAllowHint: '會跳出 Windows 的確認視窗，請按「是」。只在家裡或公司的網路放行，咖啡廳那種公用網路不會。',
  fwWaiting: '等待 Windows 確認…',
  fwFailed: '沒有放行成功',
  fwPublic: 'Windows 把目前的網路當成「公用網路」，手機連不進來。請到「設定」的「網路和網際網路」，點目前的網路，把網路類型改成「私人網路」。',
  addresses: '手機連線位址',
  addrHint: '手機要跟這台電腦連同一個 Wi-Fi。',
  noAddr: '找不到區網位址，請確認這台電腦有連上網路。',
  vpn: 'Tailscale',
  apiError: (e) => `手機連不進來：連接埠被別的程式佔用或沒有權限（${e}）。`,
  offline: (win) => `小幫手已經結束。要再打開：${win ? '在「開始」功能表找「Local AI 小幫手」' : '在應用程式選單搜尋「Local AI 小幫手」'}。`,
  quit: '結束小幫手',
  quitConfirm: (win) => `結束後手機就連不到這台電腦。\n之後要再打開：${win ? '在「開始」功能表找「Local AI 小幫手」' : '在應用程式選單搜尋「Local AI 小幫手」'}（有勾「開機時自動打開」的話，下次開機也會自己打開）。\n\n確定要結束嗎？`,
  version: '版本',
} : {
  title: 'Local AI Helper',
  subtitle: 'Lets phones at home use the AI models on this computer. Only this computer can see this page.',
  phones: 'Phones',
  pair: 'Pair a New Phone',
  noDevices: 'No phones paired yet. Press the button below and scan the QR code with your phone.',
  step1: 'Open Local AI on your phone and tap "Connect your computer".',
  step2: 'Choose "Scan QR code" and point it at the code on the left.',
  orCode: "Can't scan? Enter this pairing code on your phone:",
  countdown: (m, s) => `Pairing open for ${m}:${s}`,
  justPaired: (n) => `Paired "${n}". This phone can use this computer now.`,
  remove: 'Remove',
  removeConfirm: (n) => `Remove "${n}"? It won't be able to reach this computer until you pair it again.`,
  lastSeen: (w) => `Last used: ${w}`,
  never: 'Not used yet',
  justNow: 'just now',
  minutesAgo: (n) => `${n} min ago`,
  hoursAgo: (n) => `${n} hr ago`,
  engines: 'AI engines',
  ollamaOk: (v) => `Ollama ${v} · Running`,
  ollamaMissing: 'Ollama: not installed',
  ollamaNotRunning: 'Ollama: installed but not running',
  ollamaOff: 'Ollama: not running (using other engines)',
  managed: ' (kept running by the helper)',
  noEngine: "This computer doesn't have an AI engine yet. One click installs Ollama for you: free, no administrator rights needed, about a 1.6 GB download.",
  alsoOllama: 'You can also install Ollama so phones can download more models directly (about 1.6 GB).',
  install: 'Install Ollama',
  installing: { downloading: 'Downloading Ollama…', verifying: 'Checking the files are official…', extracting: 'Unpacking…', starting: 'Opening Ollama…' },
  installDone: 'Ollama is installed. On your phone, open "Choose Model" to download a model.',
  installFailed: {
    disk_full: 'Not enough disk space. Free up some space and try again.',
    checksum: "The download didn't match the official files and was deleted. Try again.",
    network: 'The download failed. Check your internet connection and try again.',
    extract: 'Something went wrong unpacking the files. Try again.',
    unsupported: "This computer's system isn't supported.",
    start_failed: "Ollama was installed but won't open.",
  },
  retry: 'Try Again',
  notRunningHint: "Ollama is installed but not running, so phones can't use its models.",
  startOllama: 'Open Ollama',
  starting: 'Opening…',
  startFailed: "Couldn't open Ollama",
  lastExit: (e) => `Last exit: ${e}`,
  running: (n) => `Running · ${n} models`,
  unreachable: "Can't connect",
  openaiCompat: 'OpenAI-compatible server',
  enginesHint: 'LM Studio is found automatically, as are the usual ports for llama.cpp, vLLM, Jan, and GPT4All. Phones see the models from every engine.',
  addServer: 'Add Another Server',
  redetect: 'Search Again',
  add: 'Add',
  serverNamePh: 'Name (optional)',
  serverKeyPh: 'API key (only if needed)',
  badUrl: 'Invalid address, e.g. http://127.0.0.1:8080',
  removeServer: (n) => `Remove "${n}"?`,
  computer: 'This computer',
  rename: 'Rename',
  save: 'Save',
  cancel: 'Cancel',
  nameHint: 'Phones show this computer by this name.',
  autostart: 'Open the helper when this computer starts',
  awakeOn: "A phone is using this computer, so it won't sleep for now (the screen still turns off).",
  awakeError: (e) => `The system won't let the helper keep this computer awake while a phone is using it, so it may go to sleep.${/denied/i.test(e) ? ' Open the helper after signing in to the desktop (or let it open at startup).' : ''} (${e})`,
  fwLinux: (k) => `This computer's firewall (${k}) is on, so phones may not get through. Run this line in a terminal (it asks for your password):`,
  fwLinuxBlocked: (k) => `This computer's firewall (${k}) is blocking phones. Run this line in a terminal (it asks for your password):`,
  fwSeenHint: 'This message goes away once a phone has connected.',
  copy: 'Copy',
  copied: 'Copied',
  fwWindows: 'Windows Firewall may block phones.',
  fwAllow: 'Let Phones Connect',
  fwAllowHint: 'Windows will ask for permission; choose Yes. Only home and work networks are allowed, not public ones like cafés.',
  fwWaiting: 'Waiting for Windows…',
  fwFailed: "Couldn't allow phones",
  fwPublic: 'Windows treats this network as a "Public network", so phones can\'t connect. In Settings, open Network & internet, select this network, and set the network profile type to "Private network".',
  addresses: 'Addresses for phones',
  addrHint: 'Phones need to be on the same Wi-Fi as this computer.',
  noAddr: 'No local network address found. Check that this computer is connected.',
  vpn: 'Tailscale',
  apiError: (e) => `Phones can't connect: the port is in use by another program or not permitted (${e}).`,
  offline: (win) => `The helper has quit. To open it again, ${win ? 'find "Local AI Helper" in the Start menu' : 'search for "Local AI Helper" in your app menu'}.`,
  quit: 'Quit Helper',
  quitConfirm: (win) => `Phones won't be able to reach this computer after you quit.\nTo open it again later, ${win ? 'find "Local AI Helper" in the Start menu' : 'search for "Local AI Helper" in your app menu'} (it also opens at startup if "Open the helper when this computer starts" is checked).\n\nQuit anyway?`,
  version: 'Version',
};
document.documentElement.lang = zh ? 'zh-Hant' : 'en';
document.title = T.title;
for (const el of document.querySelectorAll('[data-t]')) {
  const v = T[el.dataset.t];
  el.textContent = typeof v === 'function' ? v(isWin) : v;
}

const $ = (id) => document.getElementById(id);
const post = (path, body) =>
  fetch(path, { method: 'POST', headers: { 'X-Local-AI': '1', 'Content-Type': 'application/json' }, body: JSON.stringify(body ?? {}) }).then((r) => (r.ok ? r.json() : null));

function ago(iso) {
  if (!iso) return T.never;
  const min = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
  if (min < 1) return T.justNow;
  if (min < 60) return T.minutesAgo(min);
  if (min < 24 * 60) return T.hoursAgo(Math.floor(min / 60));
  return new Date(iso).toLocaleDateString();
}

let current = null;
function render(st) {
  current = st;
  $('offline').hidden = true;
  $('apiError').hidden = !st.apiError;
  if (st.apiError) $('apiError').textContent = T.apiError(st.apiError);

  // 手機
  const pairing = st.pairing;
  $('pairingView').hidden = !pairing;
  $('phonesView').hidden = !!pairing;
  if (pairing) {
    if ($('qr').src !== pairing.qr) $('qr').src = pairing.qr;
    $('code').textContent = pairing.code.slice(0, 3) + ' ' + pairing.code.slice(3);
    tick();
  }
  $('paired').hidden = !st.paired;
  if (st.paired) $('paired').textContent = T.justPaired(st.paired.name);
  const list = $('devices');
  list.replaceChildren();
  $('noDevices').hidden = st.devices.length > 0;
  for (const d of st.devices) {
    const li = document.createElement('li');
    const info = document.createElement('div');
    info.className = 'grow';
    const name = document.createElement('div');
    name.textContent = d.name;
    const when = document.createElement('div');
    when.className = 'when';
    when.textContent = T.lastSeen(ago(d.lastSeenAt));
    info.append(name, when);
    const rm = document.createElement('button');
    rm.className = 'danger';
    rm.textContent = T.remove;
    rm.onclick = async () => {
      if (!confirm(T.removeConfirm(d.name))) return;
      const next = await post(`/admin/api/devices/${encodeURIComponent(d.id)}/remove`);
      if (next) render(next);
    };
    li.append(info, rm);
    list.append(li);
  }

  // AI 引擎
  const engines = $('engines');
  engines.replaceChildren();
  const othersOk = st.engines.some((e) => e.kind !== 'ollama' && e.ok);
  for (const e of st.engines) {
    const row = document.createElement('div');
    row.className = 'row';
    const dot = document.createElement('span');
    dot.className = e.ok ? 'dot' : 'dot off';
    const text = document.createElement('span');
    text.className = 'grow';
    const host = (e.url || '').replace(/^https?:\/\//, '');
    const name = e.name || `${T.openaiCompat}（${host}）`;
    if (e.kind === 'ollama') {
      const ol = st.ollama || {};
      text.textContent = e.ok
        ? T.ollamaOk(e.version) + (ol.managing ? T.managed : '')
        : othersOk && ol.installed ? T.ollamaOff : ol.installed ? T.ollamaNotRunning : T.ollamaMissing;
    } else text.textContent = `${name}・${e.ok ? T.running(e.models) : T.unreachable}`;
    row.append(dot, text);
    if (e.added) {
      const rm = document.createElement('button');
      rm.className = 'danger';
      rm.textContent = T.remove;
      rm.onclick = async () => {
        if (!confirm(T.removeServer(name))) return;
        const next = await post(`/admin/api/servers/${encodeURIComponent(e.id.replace(/^server:/, ''))}/remove`);
        if (next) render(next);
      };
      row.append(rm);
    }
    engines.append(row);
  }
  renderOllama(st, othersOk);

  // 使用中不睡眠
  const aw = $('awake');
  aw.hidden = !(st.awake?.active || st.awake?.error);
  aw.className = st.awake?.error ? 'hint warn' : 'hint ok';
  aw.textContent = st.awake?.error ? T.awakeError(st.awake.error) : T.awakeOn;

  // 開機自動啟動
  $('autostartRow').hidden = !st.autostart;
  if (st.autostart && document.activeElement !== $('autostart')) $('autostart').checked = st.autostart.enabled;

  renderFirewall(st.firewall);

  // 這台電腦
  if ($('nameEdit').hidden) $('name').textContent = st.name;
  $('version').textContent = `${T.version} ${st.version}`;
  const addrs = $('addrs');
  addrs.replaceChildren();
  if (st.addrs.length === 0) addrs.textContent = T.noAddr;
  for (const a of st.addrs) {
    const line = document.createElement('div');
    line.textContent = `${a.ip}:${st.apiPort}`;
    if (a.kind === 'vpn') {
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = T.vpn;
      line.append(tag);
    }
    addrs.append(line);
  }
}

// 防火牆：Linux 給指令（要 sudo，小幫手不代勞）；Windows 一個按鈕跳出系統確認
let fwBusy = false;
function renderFirewall(fw) {
  const box = $('firewallBox');
  if (fwBusy) return;
  box.replaceChildren();
  box.hidden = true;
  if (!fw || !fw.kind) return;
  const p = (text, cls) => {
    const el = document.createElement('p');
    el.textContent = text;
    if (cls) el.className = cls;
    return el;
  };
  if (fw.publicNetwork) {
    box.hidden = false;
    box.append(p(T.fwPublic, 'warn'));
  }
  if (fw.open === 'yes') return;
  box.hidden = false;
  if (fw.command) {
    box.append(p(fw.open === 'no' ? T.fwLinuxBlocked(fw.kind) : T.fwLinux(fw.kind)));
    const row = document.createElement('div');
    row.className = 'cmd';
    const code = document.createElement('code');
    code.textContent = fw.command;
    const copy = document.createElement('button');
    copy.textContent = T.copy;
    copy.onclick = async () => {
      try {
        await navigator.clipboard.writeText(fw.command);
      } catch {
        const r = document.createRange();
        r.selectNodeContents(code);
        getSelection().removeAllRanges();
        getSelection().addRange(r);
        document.execCommand('copy');
      }
      copy.textContent = T.copied;
      setTimeout(() => (copy.textContent = T.copy), 1500);
    };
    row.append(code, copy);
    box.append(row, p(T.fwSeenHint, 'hint'));
  } else if (fw.canFix) {
    const b = document.createElement('button');
    b.className = 'primary';
    b.textContent = T.fwAllow;
    b.onclick = async () => {
      fwBusy = true;
      b.disabled = true;
      b.textContent = T.fwWaiting;
      const r = await fetch('/admin/api/firewall/allow', { method: 'POST', headers: { 'X-Local-AI': '1' } });
      fwBusy = false;
      if (!r.ok) {
        const e = await r.json().catch(() => ({}));
        alert(`${T.fwFailed}\n${e.error || ''}`);
      }
      refresh();
    };
    box.append(p(T.fwWindows), b, p(T.fwAllowHint, 'hint'));
  }
}

// 安裝／打開 Ollama
let starting = false;
const installBusy = (st) => ['downloading', 'verifying', 'extracting', 'starting'].includes(st.ollama?.install?.state);
function renderOllama(st, othersOk) {
  const box = $('ollamaBox');
  const ol = st.ollama;
  const up = st.engines.some((e) => e.kind === 'ollama' && e.ok);
  box.replaceChildren();
  box.hidden = true;
  if (!ol) return;
  const p = document.createElement('p');
  const button = (label, primary, onclick) => {
    const b = document.createElement('button');
    b.textContent = label;
    if (primary) b.className = 'primary';
    b.onclick = onclick;
    return b;
  };
  const inst = ol.install || {};
  if (installBusy(st)) {
    box.hidden = false;
    p.textContent = T.installing[inst.state];
    box.append(p);
    if (inst.state === 'downloading' && inst.total > 0) {
      const track = document.createElement('div');
      track.className = 'track';
      const fill = document.createElement('div');
      fill.className = 'fill';
      fill.style.width = `${Math.floor((inst.completed / inst.total) * 100)}%`;
      track.append(fill);
      const n = document.createElement('div');
      n.className = 'hint mono';
      n.textContent = `${size(inst.completed)} / ${size(inst.total)}`;
      box.append(track, n);
    }
    return;
  }
  if (up) {
    if (inst.state === 'done') {
      box.hidden = false;
      p.className = 'ok';
      p.textContent = T.installDone;
      box.append(p);
    }
    return;
  }
  box.hidden = false;
  if (inst.state === 'failed') {
    p.className = 'error';
    p.textContent = T.installFailed[inst.code] || T.installFailed.network;
    const detail = document.createElement('p');
    detail.className = 'hint mono';
    detail.textContent = inst.error || '';
    box.append(p, detail, button(T.retry, true, install));
    return;
  }
  if (ol.installed) {
    p.textContent = T.notRunningHint;
    box.append(p);
    if (ol.error) {
      const last = document.createElement('p');
      last.className = 'hint mono';
      last.textContent = T.lastExit(ol.error);
      box.append(last);
    }
    const b = button(starting ? T.starting : T.startOllama, !othersOk, startOllama);
    b.disabled = starting;
    box.append(b);
    return;
  }
  p.textContent = othersOk ? T.alsoOllama : T.noEngine;
  box.append(p, button(T.install, !othersOk, install));
}

const size = (b) => (b >= 1e9 ? `${(b / 1e9).toFixed(2)} GB` : `${Math.round(b / 1e6)} MB`);

async function install() {
  const r = await fetch('/admin/api/ollama/install', { method: 'POST', headers: { 'X-Local-AI': '1' } });
  if (r.ok) render(await r.json());
  else refresh();
}

async function startOllama() {
  starting = true;
  if (current) render(current);
  const r = await fetch('/admin/api/ollama/start', { method: 'POST', headers: { 'X-Local-AI': '1' } });
  starting = false;
  if (!r.ok) {
    const e = await r.json().catch(() => ({}));
    alert(`${T.startFailed}\n${e.error || ''}`);
  }
  refresh();
}

// 配對倒數：每秒更新；到時間就重新問狀態（時段會自己關）
function tick() {
  if (!current?.pairing) return;
  const left = Math.max(0, Math.round((new Date(current.pairing.expiresAt).getTime() - Date.now()) / 1000));
  $('countdown').textContent = T.countdown(Math.floor(left / 60), String(left % 60).padStart(2, '0'));
  if (left === 0) refresh();
}

async function refresh() {
  try {
    const r = await fetch('/admin/api/status', { cache: 'no-store' });
    render(await r.json());
  } catch {
    $('offline').hidden = false;
  }
}

$('serverName').placeholder = T.serverNamePh;
$('serverKey').placeholder = T.serverKeyPh;
$('addServerBtn').onclick = () => { $('serverForm').hidden = false; $('engineActions').hidden = true; $('serverUrl').focus(); };
$('cancelServer').onclick = () => { $('serverForm').hidden = true; $('engineActions').hidden = false; $('serverError').textContent = ''; };
$('serverForm').onsubmit = async (e) => {
  e.preventDefault();
  const next = await post('/admin/api/servers', { url: $('serverUrl').value, name: $('serverName').value, apiKey: $('serverKey').value });
  if (!next) { $('serverError').textContent = T.badUrl; return; }
  $('serverForm').reset();
  $('serverForm').hidden = true;
  $('engineActions').hidden = false;
  $('serverError').textContent = '';
  render(next);
};
$('redetectBtn').onclick = async () => {
  const next = await post('/admin/api/engines/redetect');
  if (next) render(next);
};
$('startPairing').onclick = async () => {
  const st = await post('/admin/api/pairing');
  if (st) render(st);
};
$('stopPairing').onclick = async () => {
  const st = await post('/admin/api/pairing/stop');
  if (st) render(st);
};
$('renameBtn').onclick = () => {
  $('nameInput').value = current?.name ?? '';
  $('nameView').hidden = true;
  $('nameEdit').hidden = false;
  $('nameInput').focus();
};
$('cancelRename').onclick = () => { $('nameEdit').hidden = true; $('nameView').hidden = false; };
$('nameEdit').onsubmit = async (e) => {
  e.preventDefault();
  const name = $('nameInput').value.trim();
  if (!name) return;
  await post('/admin/api/name', { name });
  $('nameEdit').hidden = true;
  $('nameView').hidden = false;
  refresh();
};
$('autostart').onchange = async (e) => {
  const next = await post('/admin/api/autostart', { enabled: e.target.checked });
  if (next) render(next);
  else refresh();
};
$('quitBtn').onclick = async () => {
  if (!confirm(T.quitConfirm(isWin))) return;
  await post('/admin/api/quit').catch(() => {});
  setTimeout(refresh, 500);
};

refresh();
// 配對中每秒問一次（手機配對成功要馬上顯示），平常 3 秒
const fast = () => current?.pairing || (current && installBusy(current));
setInterval(() => (fast() ? refresh() : null), 1000);
setInterval(() => (fast() ? null : refresh()), 3000);
setInterval(tick, 1000);
</script>
